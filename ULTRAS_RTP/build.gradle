plugins {
    id 'java-library'
}

group = 'com.ultras'
version = project.property('pluginVersion')

repositories {
    mavenCentral()
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.property('paperVersion')}"
}

def javaTarget = (project.property('targetJava') as String).toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaTarget)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaTarget
}

processResources {
    filteringCharset = 'UTF-8'
    def props = [version: project.version.toString(), apiVersion: project.property('apiVersion').toString()]
    inputs.properties(props)
    filesMatching('plugin.yml') { expand(props) }
}

jar {
    archiveFileName = "ULTRAS_RTP-${project.version}.jar"
}
